<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar di RevoU</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <img src="images/profile.png" alt="profile">
        <ol>
            <li><a href="#Home">Home</a></li>
            <li><a href="our-profile.html">Our Profile</a></li>
            <li><a href="#Portofolio">Portofolio</a></li>
            <li><a href="#MessageUs">Message Us</a></li>
        </ol>
    </nav>
    <hr>
    <div id="Home" class="responsive">
        <h1>Hi <span id="username">User</span>, Welcome to Website!</h1>
        <p>Ini adalah website latihan pertama</p>
    </div>
    <hr>
    <div id="Portofolio" class="responsive">
        <h1>Our Headquarter</h1>
        <div id="images">
            <div>
                <img src="images/jakarta.webp" alt="jakarta">
                <p>Jakarta</p>
            </div>
            <div>
                <img src="images/bandung.jpeg" alt="bandung">
                <p>Bandung</p>
            </div>
            <div>
                <img src="images/bali.jpg" alt="bali">
                <p>Bali</p>
            </div>
        </div>
    </div>
    <hr>
    <div id="MessageUs" class="responsive">
        <h1>Message Us</h1>
        <form id="messageForm">
            <table style="border-collapse: collapse;">
                <tr>
                <td><label for="nama">Nama</label></td>
                <td>: <input type="text" name="nama" id="nama" required></td>
                </tr>
                <tr>
                <td><label for="tanggal_lahir">Tanggal Lahir</label></td>
                <td>: <input type="date" name="tanggal_lahir" id="tanggal_lahir" required></td>
                </tr>
                <tr>
                <td><label for="jk">Jenis Kelamin</label></td>
                <td>: 
                    <input type="radio" id="jk_laki" name="jk" value="Laki-laki" checked>
                    <label for="jk_laki">Laki-laki</label>
                    <input type="radio" id="jk_perempuan" name="jk" value="Perempuan">
                    <label for="jk_perempuan">Perempuan</label>
                </td>
                </tr>
                <tr>
                <td><label for="pesan">Pesan</label></td>
                <td>: <textarea name="pesan" id="pesan" placeholder="Pesan" required></textarea></td>
                </tr>
                <tr>
                <td></td>
                <td><button type="submit">Submit</button></td>
                </tr>
            </table>
        </form>
        <div id="result">
            <table style="border-collapse: collapse;">
                <tr>
                <td><strong>Current Time</strong></td>
                <td>: </td>
                </tr>
                <tr>
                <td><strong>Nama</strong></td>
                <td>: </td>
                </tr>
                <tr>
                <td><strong>Tanggal Lahir</strong></td>
                <td>: </td>
                </tr>
                <tr>
                <td><strong>Jenis Kelamin</strong></td>
                <td>: </td>
                </tr>
                <tr>
                <td><strong>Pesan</strong></td>
                <td>: </td>
                </tr>
            </table>
        </div>
    </div>
    <hr>
    <footer>
        <p>Created by Angga</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
